name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    # A suíte roda contra o mesmo Postgres usado em produção, não contra
    # SQLite. Bug de banco que só aparece no Postgres seria descoberto no
    # deploy, não aqui.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: viagens_test
          POSTGRES_USER: viagens
          POSTGRES_PASSWORD: senha-de-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O check --deploy exige 50+ caracteres. Não é segredo de verdade:
      # existe só para a suíte rodar, e o repositório é público.
      SECRET_KEY: ci-nao-e-segredo-de-producao-apenas-para-rodar-os-testes-no-github-actions
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_ENGINE: postgres
      POSTGRES_DB: viagens_test
      POSTGRES_USER: viagens
      POSTGRES_PASSWORD: senha-de-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar migrações pendentes
        # Falha se alguém alterou um model e esqueceu de gerar a migração.
        # É o erro que só aparece quando outra pessoa clona o projeto.
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar a suíte
        run: pytest --cov=travels --cov-report=term-missing

      - name: Checagem de segurança para produção
        # Mesmo comando da Fase 1. Falha se alguém desligar HSTS, cookies
        # seguros ou deixar DEBUG=True passar.
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        # Garante que o Dockerfile continua válido. Build quebrado só
        # descoberto na hora do deploy é atraso garantido.
        run: docker build -t sistema-viagens:ci .
