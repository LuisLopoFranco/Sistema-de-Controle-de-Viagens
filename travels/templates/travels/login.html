{% extends 'travels/base.html' %}

{% block title %}Login - Sistema de Viagens{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-airplane-fill text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-3">Sistema de Viagens</h3>
                    <p class="text-muted">Faça login para continuar</p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>

                    <div class="text-center">
                        <p class="text-muted mb-0">Não tem uma conta?</p>
                        <a href="{% url 'register' %}" class="text-decoration-none">Cadastre-se aqui</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
